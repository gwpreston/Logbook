# Logbook + PostgreSQL. Works unedited:   docker compose up -d   → http://localhost:8080
# Override any variable in a .env file next to this one (see .env.example).
# MySQL instead? docker compose -f docker-compose.mysql.yml up -d
# A local model beside it (docs/ai.md)?   docker compose --profile ai up -d
#   then on Settings → AI add Ollama at http://ollama:11434

name: logbook

services:
  app:
    image: logbook:local
    build: .
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_LOCALE: ${APP_LOCALE:-en}
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-logbook}
      DB_USER: ${DB_USER:-logbook}
      DB_PASSWORD: ${DB_PASSWORD:-logbook}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_SECURE: ${SESSION_SECURE:-}
      UPLOAD_PATH: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      # Notifications are set up in the app (Settings → Delivery, Account → Notifications).
      # NTFY_* and GOTIFY_* are passed only so the v3.3.0 upgrade can import them once;
      # they are not read after it (see .env.example). WEBHOOK_URL is deprecated.
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      GOTIFY_URL: ${GOTIFY_URL:-}
      GOTIFY_TOKEN: ${GOTIFY_TOKEN:-}
      GOTIFY_PRIORITY: ${GOTIFY_PRIORITY:-5}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-900}
      # AI (docs/ai.md): connections are set on Settings → AI.
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_LOG_CONTENT: ${AI_LOG_CONTENT:-false}
      AI_ALLOW_INSECURE_TLS: ${AI_ALLOW_INSECURE_TLS:-true}
      # A public demo that resets itself (docs/demo-mode.md); off unless DEMO_MODE=true.
      DEMO_MODE: ${DEMO_MODE:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_RESET_HOURS: ${DEMO_RESET_HOURS:-}
    # Lets Logbook reach a model running on the Docker host itself, such as
    # Ollama installed there: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - logbook_data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logbook}
      POSTGRES_USER: ${DB_USER:-logbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logbook}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional local model server, started only with --profile ai. Pull a model
  # into it once: docker compose exec ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # CPU by default. For an NVIDIA GPU (with the NVIDIA Container Toolkit),
    # uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  logbook_data:
  postgres_data:
  ollama_data:
