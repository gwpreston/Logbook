# Dependency updates (Phase 54.10). Weekly, with minor and patch updates
# grouped into one pull request per ecosystem so a week's worth is one
# review, and a major update on its own because it is the one that needs
# reading.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # phpseclib 4 renamed its namespace; firebase/php-jwt still loads
      # phpseclib3 for PS256 (known-issues K174).
      - dependency-name: phpseclib/phpseclib
        update-types: ["version-update:semver-major"]
      # PHPStan 2.3 reports false positives on correct types (known-issues
      # K175); stay on 2.2.x. Patches of 2.2 still arrive.
      - dependency-name: phpstan/phpstan
        versions: [">=2.3.0"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The base image named in the root Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]

  # The images the compose files name: the databases, the mail catcher.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A database major is a planned upgrade, not a routine bump
      # (known-issues K177, open question #596).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]
