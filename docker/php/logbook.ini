; Logbook PHP overrides (loaded after php.ini-production / -development).
; Storage is always UTC; display timezone comes from APP_TIMEZONE / user prefs.
date.timezone = UTC
expose_php = Off
memory_limit = 256M
; The app caps attachments at MAX_UPLOAD_MB and a backup to restore at
; MAX_RESTORE_MB (default 256); PHP's limits only need to allow the larger.
; A save takes up to 10 attachments, so post_max_size must also allow
; 10 × MAX_UPLOAD_MB (100 MB by default).
upload_max_filesize = 256M
post_max_size = 260M
; PHP drops files past this silently; the app takes min(10, this) per save.
max_file_uploads = 20
variables_order = "EGPCS"

opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE}
