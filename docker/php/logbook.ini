; Logbook PHP overrides (loaded after php.ini-production / -development).
; Storage is always UTC; display timezone comes from APP_TIMEZONE / user prefs.
date.timezone = UTC
expose_php = Off
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 20M
variables_order = "EGPCS"

opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE}
