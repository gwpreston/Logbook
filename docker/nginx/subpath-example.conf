# Example: Logbook at https://example.com/logbook/ behind nginx.
# Set APP_BASE_PATH=/logbook on the app. Either location style works.

server {
    listen 80;
    server_name _;
    # Keep redirects relative so they survive port mapping / TLS termination upstream.
    absolute_redirect off;

    # A) Forward the prefix unchanged (recommended). No trailing slash on proxy_pass.
    location /logbook/ {
        proxy_pass http://app:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 260m;  # restoring a backup (MAX_RESTORE_MB)
    }

    # B) Strip the prefix (trailing slash on proxy_pass). Also supported.
    location /stripped/ {
        proxy_pass http://app:80/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Visiting /logbook without the slash.
    location = /logbook {
        return 301 /logbook/;
    }
}
