# Example: Logbook at https://example.com/logbook/ behind nginx, with Authelia
# forward auth and header sign-in (docs/sso.md "Header sign-in").
#
# On the app:
#   APP_BASE_PATH=/logbook
#   AUTH_PROXY_HEADER=Remote-User
#   AUTH_PROXY_NAME_HEADER=Remote-Name
#   AUTH_PROXY_EMAIL_HEADER=Remote-Email
#   AUTH_PROXY_GROUPS_HEADER=Remote-Groups
#   AUTH_PROXY_TRUSTED=<the address nginx connects to the app from, e.g. its container network>
#   AUTH_PROXY_LOGOUT_URL=https://auth.example.com/logout
#
# Two rules make this safe, and this file keeps both:
#   1. The app is reachable only through nginx (no published port of its own).
#   2. nginx sets the Remote-* headers on EVERY request it passes on, from
#      Authelia's answer or empty, so whatever a client sends is replaced.
#      nginx also drops client headers with underscores (Remote_User), which
#      PHP would otherwise read as Remote-User: keep underscores_in_headers off.

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    # The default; never switch it on in front of header sign-in.
    underscores_in_headers off;

    # Authelia's authorization endpoint (Authelia 4.38+). Internal only.
    location = /internal/authelia/authz {
        internal;
        proxy_pass http://authelia:9091/api/authz/auth-request;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL    $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Content-Length    "";
        proxy_set_header Connection        "";
        proxy_pass_request_body off;
    }

    # The app's pages: forward auth first, then the user's headers from Authelia.
    location /logbook/ {
        auth_request /internal/authelia/authz;
        auth_request_set $authelia_user   $upstream_http_remote_user;
        auth_request_set $authelia_groups $upstream_http_remote_groups;
        auth_request_set $authelia_name   $upstream_http_remote_name;
        auth_request_set $authelia_email  $upstream_http_remote_email;
        # Not signed in at Authelia: off to its portal, then back here.
        auth_request_set $redirection_url $upstream_http_location;
        error_page 401 =302 $redirection_url;

        proxy_pass http://app:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Always set, so a client's own Remote-* headers never reach the app.
        proxy_set_header Remote-User   $authelia_user;
        proxy_set_header Remote-Groups $authelia_groups;
        proxy_set_header Remote-Name   $authelia_name;
        proxy_set_header Remote-Email  $authelia_email;
        client_max_body_size 260m;  # restoring a backup (MAX_RESTORE_MB)
    }

    # Exempt from forward auth: the API (API keys), the calendar feed (its
    # token) and the health check. Calendar apps and scripts can't sign in at
    # Authelia. The Remote-* headers are blanked here too.
    location ~ ^/logbook/(api/|calendar/|health$) {
        proxy_pass http://app:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Remote-User   "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Name   "";
        proxy_set_header Remote-Email  "";
    }

    location = /logbook {
        return 301 /logbook/;
    }
}
