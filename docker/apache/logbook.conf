# Logbook Apache vhost (Docker image).
#
# APP_BASE_PATH is exported (normalised, possibly empty) by the entrypoint.
# Requests may arrive with or without the base-path prefix — a reverse proxy
# either forwards "/logbook/..." as-is or strips it — and both work:
#   * static assets are served from public/assets under both URLs (Alias)
#   * everything else falls through to the front controller, which normalises
#     the prefix before routing (see src/Middleware/BasePathMiddleware.php).

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    Alias "${APP_BASE_PATH}/assets" "/var/www/html/public/assets"

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    <Directory /var/www/html/public/assets>
        Header set Cache-Control "public, max-age=604800"
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
