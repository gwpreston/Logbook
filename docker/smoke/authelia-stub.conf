# Smoke test only: stands in for Authelia behind docker/nginx/forward-auth-example.conf.
# "Signed in at the proxy" is the smoke_user cookie; without it, 401 with
# Authelia's redirect, as /api/authz/auth-request answers.
server {
    listen 9091;

    location = /api/authz/auth-request {
        if ($cookie_smoke_user = "") {
            add_header Location "http://auth.example.test/?rd=$http_x_original_url" always;
            return 401;
        }
        add_header Remote-User   $cookie_smoke_user always;
        add_header Remote-Groups "logbook" always;
        add_header Remote-Name   "Smoke Tester" always;
        add_header Remote-Email  "smoke@example.test" always;
        return 200;
    }
}
