# Smoke test: the app served at /logbook behind nginx (used by CI and bin/smoke-test.sh).
# Layered on top of docker-compose.yml (paths are relative to the project root):
#   docker compose -f docker-compose.yml -f docker/smoke/compose.subpath.yml up -d --wait

services:
  app:
    environment:
      APP_BASE_PATH: /logbook

  proxy:
    image: nginx:1.29-alpine
    ports:
      - "${PROXY_PORT:-18081}:80"
    volumes:
      - ./docker/nginx/subpath-example.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
