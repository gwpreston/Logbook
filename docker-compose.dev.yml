# Development stack: source bind-mounted (PHP + Twig changes apply on reload),
# plus PostgreSQL, MySQL and MariaDB for cross-engine testing, and Mailpit,
# which catches every email the app sends (http://localhost:8025).
#
# Day to day, use ./bin/dev-setup.sh (start/stop, switch database, sample data).
#
#   docker compose -f docker-compose.dev.yml up -d                 # app on :8090 (Postgres)
#   docker compose -f docker-compose.dev.yml exec app composer check
#   bin/test-all-dbs.sh                                            # suite on every engine

name: logbook-dev

x-db-env: &db-env
  POSTGRES_DB: logbook
  POSTGRES_USER: logbook
  POSTGRES_PASSWORD: logbook

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "${APP_PORT:-8090}:80"
    environment:
      APP_ENV: development
      APP_URL: http://localhost:${APP_PORT:-8090}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      # Chosen by `bin/dev-setup.sh --mysql` etc.; Postgres when run by hand. The
      # entrypoint waits for the database, so no depends_on is needed.
      DB_DRIVER: ${DEV_DB_DRIVER:-pgsql}
      DB_HOST: ${DEV_DB_HOST:-pgsql}
      DB_NAME: ${DEV_DB_NAME:-logbook}
      DB_USER: logbook
      DB_PASSWORD: logbook
      # Per engine under bin/dev-setup.sh, so each database keeps its own photos.
      UPLOAD_PATH: ${DEV_UPLOAD_PATH:-/data/uploads}
      # Every email goes to Mailpit (spec.md §10 *Development stack*, Phase 33.1).
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: none
      MAIL_FROM: logbook@localhost
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - dev_data:/data

  # Development only: never in docker-compose.yml or docker-compose.mysql.yml.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      retries: 20

  pgsql:
    image: postgres:17-alpine
    environment: *db-env
    volumes:
      - ./docker/dev/pgsql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbook -d logbook"]
      interval: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    profiles: ["mysql", "all"]
    environment:
      MYSQL_DATABASE: logbook
      MYSQL_USER: logbook
      MYSQL_PASSWORD: logbook
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./docker/dev/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ulogbook -plogbook --silent"]
      interval: 3s
      retries: 40

  mariadb:
    image: mariadb:11.4
    profiles: ["mariadb", "all"]
    environment:
      MARIADB_DATABASE: logbook
      MARIADB_USER: logbook
      MARIADB_PASSWORD: logbook
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./docker/dev/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

volumes:
  vendor:
  dev_data:
